[package]
name = "pywebnn"
version = "0.5.13"
edition = "2021"
description = "Python bindings for W3C WebNN specification via rustnn"
license = "Apache-2.0"
repository = "https://github.com/rustnn/pywebnn"
keywords = ["webnn", "python", "machine-learning", "neural-networks", "ai"]
categories = ["api-bindings", "science"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "pywebnn"

[features]
default = ["onnx-runtime", "trtx-runtime", "dynamic-inputs"]
onnx-runtime = ["rustnn/onnx-runtime", "ort"]
coreml-runtime = ["rustnn/coreml-runtime"]
trtx-runtime = ["rustnn/trtx-runtime"]
trtx-runtime-mock = ["rustnn/trtx-runtime-mock"]
litert-runtime = ["rustnn/litert-runtime"]
cann-runtime = ["rustnn/cann-runtime"]
cann-runtime-mock = ["rustnn/cann-runtime-mock"]
dynamic-inputs = ["rustnn/dynamic-inputs"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
bytemuck = "1.14"
rustnn = { git = "https://github.com/theHamsta/rustnn", branch = "bring-dynamically_load_tensorrt-back" }
serde_json = "1.0"
webnn-graph = { git = "https://github.com/rustnn/webnn-graph", branch = "main" }
half = "2.4"
regex = "1.11"
pretty_env_logger = "0.5"
log = "0.4"
# Optional runtime dependencies
ort = { version = "=2.0.0-rc.13", optional = true, features = ["half", "load-dynamic"] }

# Make this crate independent from the parent workspace
[workspace]
